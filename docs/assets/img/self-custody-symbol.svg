<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Self Custody four-circle logo preview</title>
  <desc id="desc">Four raised circles in a row, coloured red, banknote paper, green, and Bitcoin orange, each surrounded by a black outline.</desc>

  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff4149"/>
      <stop offset="0.52" stop-color="#f5222b"/>
      <stop offset="1" stop-color="#d9121c"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="0.52" stop-color="#eee2c7"/>
      <stop offset="1" stop-color="#d2c3a2"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4ba265"/>
      <stop offset="0.52" stop-color="#3c9056"/>
      <stop offset="1" stop-color="#2c7543"/>
    </linearGradient>

    <linearGradient id="orange" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb236"/>
      <stop offset="0.52" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#dc7600"/>
    </linearGradient>

    <linearGradient id="surface-sheen" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>
  </defs>

  <!-- Flat, filter-free by design: this renders at ~80px wide in the header,
       where a feDropShadow + four animated feGaussianBlur glow rings (the
       previous version) are both imperceptible and risky -- SVG filters
       rasterize relative to the element's actual display size on some
       mobile browsers, so a blur radius tuned for this 920-wide viewBox
       becomes hugely disproportionate at ~80px and smears the whole mark
       (confirmed blurry on a real device). Flat gradients + rims have no
       such failure mode. -->
  <g>
    <!-- Draw the overlapping rims first so they read as one connected perimeter. -->
    <circle cx="126" cy="148" r="118" fill="#080a0d"/>
    <circle cx="348" cy="148" r="118" fill="#080a0d"/>
    <circle cx="570" cy="148" r="118" fill="#080a0d"/>
    <circle cx="792" cy="148" r="118" fill="#080a0d"/>

    <!-- The coloured faces remain separate; only their black rims overlap. -->
    <circle cx="126" cy="148" r="96" fill="url(#red)"/>
    <circle cx="348" cy="148" r="96" fill="url(#paper)"/>
    <circle cx="570" cy="148" r="96" fill="url(#green)"/>
    <circle cx="792" cy="148" r="96" fill="url(#orange)"/>

    <circle cx="126" cy="148" r="96" fill="url(#surface-sheen)"/>
    <circle cx="348" cy="148" r="96" fill="url(#surface-sheen)"/>
    <circle cx="570" cy="148" r="96" fill="url(#surface-sheen)"/>
    <circle cx="792" cy="148" r="96" fill="url(#surface-sheen)"/>
  </g>
</svg>
