name: build

# Every guard in this repo runs at build time, which until now meant they only
# ran when someone remembered. None of this needs a browser, so it costs a
# minute and closes that gap.
on:
  push:
    branches: ['**']
  pull_request:

# Read-only. This workflow inspects the tree and never writes to it, so the
# token it is handed should not be able to either.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs rather than tags. A tag is a moving pointer the
      # action's owner can repoint, so `@v4` is a promise to run whatever that
      # repository contains at the moment the job starts. The comment records
      # which release each SHA was, since the SHA alone says nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The default leaves the token in .git/config for every later step to
          # read. Nothing here pushes, so nothing here needs it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # The published test vectors. Every expected value comes from a
      # specification rather than from running this code.
      - name: Crypto vectors
        run: node build/tools/entropy-test.mjs

      - name: Bitcoin Core wallet.dat export
        run: node build/tools/wallet-dat-test.mjs

      - name: Browser startup preflight
        run: node build/tools/browser-preflight-test.mjs

      - name: Committed libsecp256k1 WebAssembly
        run: node build/tools/secp256k1-wasm-test.mjs

      # Also runs, in order: the icon-subset check, the fetch guard, the glyph
      # guard and the Workshop guard. Any of them failing exits non-zero.
      - name: Build and guards
        run: node build/render.mjs

      # The artifact's whole promise. Deliberately checked on Linux, where the
      # checkout has LF endings: the checksum used to describe the Windows
      # working copy rather than the committed bytes, and this is the job that
      # would have caught it.
      - name: Published checksum matches the artifact
        working-directory: docs
        run: sha256sum -c entropy-offline.html.sha256

      # A build on a clean checkout must leave the tree exactly as committed.
      # If this fails, either someone edited docs/ by hand or the build is not
      # deterministic -- and a non-deterministic build cannot have a meaningful
      # published checksum.
      # --porcelain rather than `git diff`, because a diff says nothing about
      # untracked files: a diagnostic written into the repo root by a stray
      # script passes a diff check and then gets committed by the next `add -A`.
      # That happened twice here before this line existed.
      - name: Generated files are current and reproducible
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build left the tree dirty -- run 'node build/render.mjs', commit generated output, and remove stray files"
            git status --porcelain
            exit 1
          fi

  build-wasm:
    name: Build · libsecp256k1 WASM from pinned Rust sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Rebuild the WebAssembly artifact
        run: npm run build:wasm
      # The whole point of the pinned toolchain and the committed lockfile.
      # Without this the job proves the sources compile and pass vectors, and
      # says nothing about the blob readers actually receive: a substituted
      # artifact is never compared to anything, because build:wasm overwrites
      # it before the test runs and the tree-dirty check lives in a job that
      # never builds the WASM. Those two controls have to meet somewhere, and
      # this is the only place they can.
      - name: Rebuilt artifact matches the committed one
        run: |
          if ! git diff --quiet -- build/tools/secp256k1-wasm-b64.js; then
            echo "::error::the committed libsecp256k1 WebAssembly is not what these pinned Rust sources build -- run 'npm run build:wasm' and commit the result"
            git diff --stat -- build/tools/secp256k1-wasm-b64.js
            exit 1
          fi
      - name: Test the freshly built engine
        run: node build/tools/secp256k1-wasm-test.mjs
