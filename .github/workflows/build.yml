name: build

# Every guard in this repo runs at build time, which until now meant they only
# ran when someone remembered. None of this needs a browser, so it costs a
# minute and closes that gap.
on:
  push:
    branches: ['**']
  pull_request:

# Read-only. This workflow inspects the tree and never writes to it, so the
# token it is handed should not be able to either.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs rather than tags. A tag is a moving pointer the
      # action's owner can repoint, so `@v4` is a promise to run whatever that
      # repository contains at the moment the job starts. The comment records
      # which release each SHA was, since the SHA alone says nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The default leaves the token in .git/config for every later step to
          # read. Nothing here pushes, so nothing here needs it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # The published test vectors. Every expected value comes from a
      # specification rather than from running this code.
      - name: Crypto vectors
        run: node build/tools/entropy-test.mjs

      - name: Bitcoin Core wallet.dat export
        run: node build/tools/wallet-dat-test.mjs

      - name: Browser startup preflight
        run: node build/tools/browser-preflight-test.mjs

      - name: Committed libsecp256k1 WebAssembly
        run: node build/tools/secp256k1-wasm-test.mjs

      - name: Beta acknowledgement and sticky warning
        run: node build/tools/beta-warning-test.mjs

      - name: Card-suit font fallbacks
        run: node build/tools/card-suit-font-test.mjs

      - name: Offline artifact attestation policy
        run: node build/tools/attestation-workflow-test.mjs

      # Also runs, in order: the icon-subset check, the fetch guard, the glyph
      # guard and the Workshop guard. Any of them failing exits non-zero.
      - name: Build and guards
        run: node build/render.mjs

      # The artifact's whole promise. Deliberately checked on Linux, where the
      # checkout has LF endings: the checksum used to describe the Windows
      # working copy rather than the committed bytes, and this is the job that
      # would have caught it.
      - name: Published checksum matches the artifact
        working-directory: docs
        run: sha256sum -c entropy-offline.html.sha256

      # A build on a clean checkout must leave the tree exactly as committed.
      # If this fails, either someone edited docs/ by hand or the build is not
      # deterministic -- and a non-deterministic build cannot have a meaningful
      # published checksum.
      # --porcelain rather than `git diff`, because a diff says nothing about
      # untracked files: a diagnostic written into the repo root by a stray
      # script passes a diff check and then gets committed by the next `add -A`.
      # That happened twice here before this line existed.
      - name: Generated files are current and reproducible
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build left the tree dirty -- run 'node build/render.mjs', commit generated output, and remove stray files"
            git status --porcelain
            exit 1
          fi

  build-wasm:
    name: Build · libsecp256k1 WASM in the published builder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The published, attested builder, by immutable digest. A tag can be
      # repointed; a digest cannot, and reproducibility resting on a mutable
      # pointer is not reproducibility. Anyone can reconstruct this image from
      # secp256k1-wasm/builder/ and compare -- that path is exercised by the
      # publish workflow, so it does not also need to run on every PR.
      WASM_BUILDER_IMAGE: ghcr.io/deesneez/selfcustody-wasm-builder@sha256:1418e85a9c5fb5759fd5b4bdc42f3485cbc8dedf3c78e259fa6fe815a806f9ae
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Exactly the Node the builder image carries. It does not generate
          # the artifact -- the image's own Node writes the wrapper -- but it
          # runs the parse gate and the engine vectors below.
          node-version: '22.23.2'

      # First, and cheap. A backslash eaten while writing wasm-compile.mjs
      # produced replaceAll('\', '/') -- an unterminated string that reached CI
      # intact and cost a full image build to discover. node --check exits
      # non-zero on exactly that.
      - name: Builder scripts parse
        run: |
          node --check build/tools/wasm-compile.mjs
          node --check build/tools/wasm-wrap.mjs
          node --check build/tools/build-wasm-container.mjs
          bash -n build/tools/snapshot-probe.sh
          bash -n secp256k1-wasm/builder/fetch-inputs.sh
          echo "all builder scripts parse"

      # Both passes go through the public entry point rather than a separate
      # CI-only invocation, so what is verified here and what a reader runs
      # locally cannot drift apart. build:wasm:container pulls the digest,
      # asserts the image is linux/amd64, compiles --offline and wraps.
      - name: Build the artifact, pass one
        id: pass_one
        run: |
          npm run build:wasm:container
          mkdir -p "$RUNNER_TEMP/candidate"
          cp build/tools/secp256k1-wasm-b64.js "$RUNNER_TEMP/candidate/secp256k1-wasm-b64.js"
          sha256sum secp256k1-wasm/target/wasm32-unknown-unknown/release/secp256k1_wasm.wasm \
            | awk '{print $1}' > "$RUNNER_TEMP/raw-first.sha"
          cat "$RUNNER_TEMP/raw-first.sha"

      # Compilation and packaging are compared separately so a failure names
      # which half moved instead of leaving it to be guessed.
      - name: Build again from clean, compare raw wasm and wrapper
        run: |
          rm -rf secp256k1-wasm/target
          npm run build:wasm:container
          # Kept beside pass one's copy until both comparisons agree, so a
          # mismatch uploads both byte sequences rather than one file and the
          # other's hash. Removed on success, leaving a green run to upload
          # only the canonical filename.
          cp build/tools/secp256k1-wasm-b64.js \
            "$RUNNER_TEMP/candidate/secp256k1-wasm-b64.pass-two.js"
          sha256sum secp256k1-wasm/target/wasm32-unknown-unknown/release/secp256k1_wasm.wasm \
            | awk '{print $1}' > "$RUNNER_TEMP/raw-second.sha"
          a=$(cat "$RUNNER_TEMP/raw-first.sha"); b=$(cat "$RUNNER_TEMP/raw-second.sha")
          if [ "$a" != "$b" ]; then
            echo "::error::compilation is nondeterministic in the published builder: $a vs $b"
            exit 1
          fi
          echo "raw wasm stable: $a"
          if ! cmp -s "$RUNNER_TEMP/candidate/secp256k1-wasm-b64.js" build/tools/secp256k1-wasm-b64.js; then
            echo "::error::packaging is nondeterministic in the published builder"
            sha256sum "$RUNNER_TEMP/candidate/secp256k1-wasm-b64.js" build/tools/secp256k1-wasm-b64.js
            exit 1
          fi
          echo "wrapper stable:  $(sha256sum build/tools/secp256k1-wasm-b64.js | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/candidate/secp256k1-wasm-b64.pass-two.js"

      - name: Test the freshly built engine
        run: node build/tools/secp256k1-wasm-test.mjs

      # Gated on pass one having actually run, and uploading pass one's own
      # copy rather than the workspace file. hashFiles() was worse than no
      # condition at all: the wrapper is committed, so it is present the moment
      # checkout finishes, and a failure in the parse gate, the pull or the
      # compile would have uploaded the untouched committed file labelled as
      # freshly built -- the exact bytes under suspicion, wearing the name of
      # their replacement.
      #
      # The directory, not one file: on success it holds only the canonical
      # secp256k1-wasm-b64.js, and on a determinism failure it also holds
      # pass two's, so the two byte sequences can be diffed directly instead
      # of being described by their hashes.
      - name: Upload the built artifact
        if: always() && steps.pass_one.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secp256k1-wasm-b64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error

      # The provenance gate, last. Functional equivalence does not establish
      # provenance: passing the vectors above says the engine works, not that
      # the committed bytes are the ones this builder produces.
      - name: Committed artifact matches the published builder's output
        run: |
          if ! git diff --quiet -- build/tools/secp256k1-wasm-b64.js; then
            echo "::error::the committed libsecp256k1 WebAssembly is not what the published builder produces -- download the artifact from this run and commit it"
            git diff --stat -- build/tools/secp256k1-wasm-b64.js
            exit 1
          fi
          echo "committed artifact matches the published builder"

  # This job is deliberately separate from verification. Pull requests and
  # ordinary branch pushes keep a read-only token; only an already-verified
  # commit on the default branch receives the short-lived OIDC permission
  # needed to publish provenance for the exact downloadable HTML bytes.
  attest-offline:
    name: Attest · offline Entropy Workshop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Attest the downloadable HTML
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: docs/entropy-offline.html
