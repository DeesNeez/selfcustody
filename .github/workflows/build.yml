name: build

# Every guard in this repo runs at build time, which until now meant they only
# ran when someone remembered. None of this needs a browser, so it costs a
# minute and closes that gap.
on:
  push:
    branches: ['**']
  pull_request:

# Read-only. This workflow inspects the tree and never writes to it, so the
# token it is handed should not be able to either.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs rather than tags. A tag is a moving pointer the
      # action's owner can repoint, so `@v4` is a promise to run whatever that
      # repository contains at the moment the job starts. The comment records
      # which release each SHA was, since the SHA alone says nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The default leaves the token in .git/config for every later step to
          # read. Nothing here pushes, so nothing here needs it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # The published test vectors. Every expected value comes from a
      # specification rather than from running this code.
      - name: Crypto vectors
        run: node build/tools/entropy-test.mjs

      - name: Bitcoin Core wallet.dat export
        run: node build/tools/wallet-dat-test.mjs

      - name: Browser startup preflight
        run: node build/tools/browser-preflight-test.mjs

      - name: Committed libsecp256k1 WebAssembly
        run: node build/tools/secp256k1-wasm-test.mjs

      # Also runs, in order: the icon-subset check, the fetch guard, the glyph
      # guard and the Workshop guard. Any of them failing exits non-zero.
      - name: Build and guards
        run: node build/render.mjs

      # The artifact's whole promise. Deliberately checked on Linux, where the
      # checkout has LF endings: the checksum used to describe the Windows
      # working copy rather than the committed bytes, and this is the job that
      # would have caught it.
      - name: Published checksum matches the artifact
        working-directory: docs
        run: sha256sum -c entropy-offline.html.sha256

      # A build on a clean checkout must leave the tree exactly as committed.
      # If this fails, either someone edited docs/ by hand or the build is not
      # deterministic -- and a non-deterministic build cannot have a meaningful
      # published checksum.
      # --porcelain rather than `git diff`, because a diff says nothing about
      # untracked files: a diagnostic written into the repo root by a stray
      # script passes a diff check and then gets committed by the next `add -A`.
      # That happened twice here before this line existed.
      - name: Generated files are current and reproducible
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build left the tree dirty -- run 'node build/render.mjs', commit generated output, and remove stray files"
            git status --porcelain
            exit 1
          fi

  build-wasm:
    name: Build · libsecp256k1 WASM in the pinned builder
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # Every input that cannot come from signed apt metadata is verified
      # against a recorded SHA-256 before it may enter the build context: the
      # two trust-bootstrap .debs, the Rust toolchain and Node.
      - name: Fetch and verify the pinned builder inputs
        run: bash secp256k1-wasm/builder/fetch-inputs.sh

      # Context is the crate directory: the Dockerfile needs Cargo.toml and
      # Cargo.lock, which sit above builder/ where COPY cannot reach them.
      - name: Build the pinned builder image
        run: |
          docker build --tag wasm-builder:ci \
            --file secp256k1-wasm/builder/Dockerfile \
            secp256k1-wasm

      - name: Builder provenance
        run: docker run --rm wasm-builder:ci cat /etc/wasm-builder-provenance

      # --offline: the image already carries every crate the lockfile names, so
      # a build that reached the network would not be reproducing anything.
      - name: Compile
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace wasm-builder:ci \
            node build/tools/wasm-compile.mjs --offline
          sha256sum secp256k1-wasm/target/wasm32-unknown-unknown/release/secp256k1_wasm.wasm \
            | tee "$RUNNER_TEMP/wasm-first.sha"

      # Compilation and packaging are compared separately so a failure names
      # which half moved instead of leaving it to be guessed.
      - name: Compile again from clean and compare the raw wasm
        run: |
          rm -rf secp256k1-wasm/target
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace wasm-builder:ci \
            node build/tools/wasm-compile.mjs --offline
          sha256sum secp256k1-wasm/target/wasm32-unknown-unknown/release/secp256k1_wasm.wasm \
            | tee "$RUNNER_TEMP/wasm-second.sha"
          a=$(awk '{print $1}' "$RUNNER_TEMP/wasm-first.sha")
          b=$(awk '{print $1}' "$RUNNER_TEMP/wasm-second.sha")
          if [ "$a" = "$b" ]; then
            echo "STABLE: compilation is deterministic in the pinned builder ($a)"
          else
            echo "::error::compilation is nondeterministic in one fixed environment: $a vs $b"
            exit 1
          fi

      - name: Wrap
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace wasm-builder:ci \
            node build/tools/wasm-wrap.mjs
          sha256sum build/tools/secp256k1-wasm-b64.js

      - name: Test the freshly built engine
        run: node build/tools/secp256k1-wasm-test.mjs

      # Uploaded before the gate and unconditionally: on a mismatch these are
      # exactly the bytes under consideration, and a red gate must not discard
      # its own candidate. Explicitly labelled a candidate -- it becomes
      # canonical only by passing the vectors and the determinism check above.
      - name: Upload the candidate artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secp256k1-wasm-b64-candidate-${{ github.sha }}
          path: build/tools/secp256k1-wasm-b64.js
          if-no-files-found: error

      # The provenance gate, last and unchanged. Functional equivalence does
      # not establish provenance, so passing vectors above does not substitute
      # for this: the shipped wrapper must be what the pinned builder makes.
      - name: Wrapper matches the committed artifact
        run: |
          if ! git diff --quiet -- build/tools/secp256k1-wasm-b64.js; then
            echo "::error::the committed libsecp256k1 WebAssembly is not what the pinned builder produces -- download the candidate artifact from this run and commit it"
            git diff --stat -- build/tools/secp256k1-wasm-b64.js
            exit 1
          fi

  # TEMPORARY. Establishes the builder's input set before any Dockerfile
  # exists. Delete once the pinned builder image is published and referenced
  # by digest. The script it runs is build/tools/snapshot-probe.sh.
  snapshot-probe:
    name: Probe · pinned Ubuntu snapshot for the WASM builder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No mounts, so the answer is the base image's own. Expected to stop at
      # apt-get update if the image ships no CA bundle -- which is itself the
      # finding: the Dockerfile would then need a pinned ca-certificates
      # bootstrap before it can reach an HTTPS archive.
      - name: Base image CA state, unassisted
        run: |
          docker run --rm \
            -v "$PWD/build/tools/snapshot-probe.sh:/probe.sh:ro" \
            ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            bash /probe.sh \
          || echo "(stopped without CA trust -- Dockerfile needs a pinned ca-certificates bootstrap)"

      - name: Snapshot resolves the measured toolchain in a clean container
        run: |
          docker run --rm \
            -v "$PWD/build/tools/snapshot-probe.sh:/probe.sh:ro" \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            bash /probe.sh
